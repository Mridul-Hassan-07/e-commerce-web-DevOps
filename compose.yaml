services:
  mehnajmart-app:
    image: ${DOCKERHUB_USERNAME}/mehnaj-mart:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mehnajmart_web
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=${NODE_ENV}
      - VITE_APP_NAME=${VITE_APP_NAME}
    depends_on:
      mehnajmart-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - mehnajmart_net

  mehnajmart-db:
    image: postgres:16-alpine
    container_name: mehnajmart_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: ${PGDATA}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mehnaj_admin -d mehnajmart_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mehnajmart_net

volumes:
  postgres_data:
    driver: local
    name: mehnajmart_postgres_volume

networks:
  mehnajmart_net:
    driver: bridge
    name: mehnajmart_network
