services:
  mehnajmart-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mehnajmart_web
    restart: unless-stopped
    ports:
      - "8080:80"
      - "3000:80"
    environment:
      - NODE_ENV=production
      - VITE_APP_NAME=MehnajMart
    depends_on:
      mehnajmart-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - mehnajmart_net

  mehnajmart-db:
    image: postgres:16-alpine
    container_name: mehnajmart_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mehnajmart_db
      POSTGRES_USER: mehnaj_admin
      POSTGRES_PASSWORD: MehnajDB_99_SecurePass2026
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mehnaj_admin -d mehnajmart_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mehnajmart_net

volumes:
  postgres_data:
    driver: local
    name: mehnajmart_postgres_volume

networks:
  mehnajmart_net:
    driver: bridge
    name: mehnajmart_network
