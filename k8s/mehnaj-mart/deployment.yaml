apiVersion: apps/v1
kind: Deployment
metadata:
  name: mehnaj-mart-deployment
  namespace: mehnaj-mart
spec:
  replicas: 3
  selector:
    matchLabels:
      type: mehnaj-mart
  template:
    metadata:
      name: mehnaj-mart
      labels:
        type: mehnaj-mart
    spec:
      containers:
      - name: mehnaj-mart
        image: mridul1265/mehnaj-mart:latest
        ports:
        - containerPort: 80

        envFrom:
        - secretRef:
            name: mehnaj-mart-secret

        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 5
